services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: validatecall
      POSTGRES_USER: validatecall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-validatecall_local}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - validatecall_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validatecall -d validatecall"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  validatecall_pg:
